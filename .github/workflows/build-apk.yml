name: Build BlockZone APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
permissions:
  contents: write
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build embedded ad blocker extension
        working-directory: app/src/main/assets/blockzone_adblock_src
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install Android SDK packages
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BlockZone-3.1.0-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BlockZone-3.1-APK
          path: BlockZone-3.1.0-arm64.apk
          retention-days: 30
      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v3.1.0-arm64 --cleanup-tag -y || true
          gh release create v3.1.0-arm64 BlockZone-3.1.0-arm64.apk --title "BlockZone 3.1.0 ARM64" --notes "BlockZone 3.1.0: bloqueio antecipado de metadados de anúncios do player do YouTube, fallback de ad skip e reprodução em segundo plano com tela apagada."
