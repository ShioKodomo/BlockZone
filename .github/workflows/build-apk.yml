name: Build BlockZone APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
permissions:
  contents: write
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Embed native adblock-rust runtime
        run: |
          rm -rf /tmp/adblock-aar app/libs/adblock-0.1.3.jar app/src/main/jniLibs app/src/main/assets/adblock/resources.json
          mkdir -p /tmp/adblock-aar app/libs app/src/main/jniLibs app/src/main/assets/adblock
          curl -L --fail --retry 3 -o /tmp/adblock.aar https://repo1.maven.org/maven2/io/github/mlm-games/adblock/0.1.3/adblock-0.1.3.aar
          unzip -q /tmp/adblock.aar -d /tmp/adblock-aar
          cp /tmp/adblock-aar/classes.jar app/libs/adblock-0.1.3.jar
          if [ -d /tmp/adblock-aar/jni ]; then cp -a /tmp/adblock-aar/jni/. app/src/main/jniLibs/; fi
          if [ -f /tmp/adblock-aar/assets/adblock/resources.json ]; then cp /tmp/adblock-aar/assets/adblock/resources.json app/src/main/assets/adblock/resources.json; fi
          test -s app/libs/adblock-0.1.3.jar
          test -f app/src/main/jniLibs/arm64-v8a/libadblock_ffi.so
          test -s app/src/main/assets/adblock/resources.json

      - name: Bundle current adblock filter lists
        run: |
          mkdir -p app/src/main/assets/adblock
          : > app/src/main/assets/adblock/blockzone_filters.txt
          curl -L --fail --retry 3 https://easylist.to/easylist/easylist.txt >> app/src/main/assets/adblock/blockzone_filters.txt
          printf '\n' >> app/src/main/assets/adblock/blockzone_filters.txt
          curl -L --fail --retry 3 https://raw.githubusercontent.com/uBlockOrigin/uAssets/master/filters/filters.txt >> app/src/main/assets/adblock/blockzone_filters.txt
          printf '\n' >> app/src/main/assets/adblock/blockzone_filters.txt
          curl -L --fail --retry 3 https://raw.githubusercontent.com/uBlockOrigin/uAssets/master/filters/quick-fixes.txt >> app/src/main/assets/adblock/blockzone_filters.txt
          printf '\n' >> app/src/main/assets/adblock/blockzone_filters.txt
          curl -L --fail --retry 3 https://raw.githubusercontent.com/uBlockOrigin/uAssets/master/filters/filters-2026.txt >> app/src/main/assets/adblock/blockzone_filters.txt
          printf '\n' >> app/src/main/assets/adblock/blockzone_filters.txt
          curl -L --fail --retry 3 https://raw.githubusercontent.com/uBlockOrigin/uAssets/master/filters/privacy.txt >> app/src/main/assets/adblock/blockzone_filters.txt
          wc -c app/src/main/assets/adblock/blockzone_filters.txt

      - name: Install Android SDK packages
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BlockZone-3.4.0-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BlockZone-3.4.0-APK
          path: BlockZone-3.4.0-arm64.apk
          retention-days: 30

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v3.4.0-arm64 --cleanup-tag -y || true
          gh release create v3.4.0-arm64 BlockZone-3.4.0-arm64.apk --title "BlockZone 3.4.0 ARM64" --notes "BlockZone 3.4.0: nova arquitetura WebView + Brave adblock-rust nativo. Sem GeckoView e sem WebExtension. Filtros EasyList/uAssets embutidos e atualizáveis dentro do app."
