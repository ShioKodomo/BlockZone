name: Build GothTime APK
on:
  workflow_dispatch:
  push:
    branches: [ "gothtime-build" ]
permissions:
  contents: read
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Assemble GothTime 2.1.1 visual assets
        run: |
          mkdir -p app/src/main/assets/gothtime app/src/main/res/drawable-nodpi
          cat build-resources/gothtime_mascot.part1 build-resources/gothtime_mascot.part2 build-resources/gothtime_mascot.part3 build-resources/gothtime_mascot.part4 | tr -cd 'A-Za-z0-9+/=' | base64 --decode --ignore-garbage > app/src/main/assets/gothtime/mascot.webp
          cat build-resources/gothtime_ui.part1 build-resources/gothtime_ui.part2 build-resources/gothtime_ui.part3 build-resources/gothtime_ui.part4 > app/src/main/assets/gothtime/index.html
          cp app/src/main/assets/gothtime/mascot.webp app/src/main/res/drawable-nodpi/gothtime_icon.webp
          rm -f app/src/main/assets/gothtime/mascot.b64
          sed -i 's#@mipmap/ic_launcher#@drawable/gothtime_icon#g' app/src/main/AndroidManifest.xml
          sed -i 's/versionCode = [0-9][0-9]*/versionCode = 5/' app/build.gradle.kts
          sed -i 's/versionName = "[^"]*"/versionName = "2.1.1"/' app/build.gradle.kts
          test -s app/src/main/assets/gothtime/mascot.webp
          file app/src/main/assets/gothtime/mascot.webp | tee /tmp/mascot-type.txt
          grep -q 'Web/P image' /tmp/mascot-type.txt
          grep -q 'class="action hot"' app/src/main/assets/gothtime/index.html
          wc -c app/src/main/assets/gothtime/index.html app/src/main/assets/gothtime/mascot.webp

      - name: Prepare legacy compile dependency
        run: |
          rm -rf /tmp/adblock-aar app/libs/adblock-0.1.3.jar app/src/main/jniLibs app/src/main/assets/adblock/resources.json
          mkdir -p /tmp/adblock-aar app/libs app/src/main/jniLibs app/src/main/assets/adblock
          curl -L --fail --retry 3 -o /tmp/adblock.aar https://repo1.maven.org/maven2/io/github/mlm-games/adblock/0.1.3/adblock-0.1.3.aar
          unzip -q /tmp/adblock.aar -d /tmp/adblock-aar
          cp /tmp/adblock-aar/classes.jar app/libs/adblock-0.1.3.jar
          if [ -d /tmp/adblock-aar/jni ]; then cp -a /tmp/adblock-aar/jni/. app/src/main/jniLibs/; fi
          if [ -f /tmp/adblock-aar/assets/adblock/resources.json ]; then cp /tmp/adblock-aar/assets/adblock/resources.json app/src/main/assets/adblock/resources.json; fi

      - name: Install Android SDK packages
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build GothTime
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GothTime-2.1.1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GothTime-2.1.1-APK
          path: GothTime-2.1.1.apk
          retention-days: 30
