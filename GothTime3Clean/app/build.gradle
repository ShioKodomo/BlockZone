plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gothtime.optimizer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gothtime.optimizer'
        minSdk 26
        targetSdk 35
        versionCode 30
        versionName '3.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
